# Ballast web platform. Deploy from this folder: fly deploy --remote-only --ha=false
app = "ballast-web"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  MONGODB_DB = "ballast"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
