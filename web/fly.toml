# ballast. web platform. Deploy from this folder: fly deploy --remote-only --ha=false
app = "ballast-web"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  STORY_DB = "ballast_bench_muse,ballast_muse"  # main story / replay: first db with generations; real data only
  LIVE_DB = "ballast_muse"    # /live view and Run-it jobs; override per request with ?db=

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
